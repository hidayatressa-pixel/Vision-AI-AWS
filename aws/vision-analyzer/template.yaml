AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Vision-AI AWS evidence analyzer using OpenCV 5 in Lambda.

Globals:
  Function:
    Timeout: 30
    MemorySize: 1536

Resources:
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "vision-ai-evidence-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  EvidenceBucketEnforceTLS:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub "${EvidenceBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  VisionAnalyzerApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'OPTIONS,POST'"
        AllowHeaders: "'Content-Type'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10

  VisionAnalyzerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: opencv5
    Properties:
      PackageType: Image
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          OUTPUT_PREFIX: results/
          EVIDENCE_BUCKET: !Ref EvidenceBucket
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "vision-ai-evidence-${AWS::AccountId}-${AWS::Region}"
        - S3WritePolicy:
            BucketName: !Sub "vision-ai-evidence-${AWS::AccountId}-${AWS::Region}"
      Events:
        IncomingImage:
          Type: S3
          Properties:
            Bucket: !Ref EvidenceBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/
        DemoApi:
          Type: Api
          Properties:
            RestApiId: !Ref VisionAnalyzerApi
            Path: /analyze
            Method: post
        ConfigurationApi:
          Type: Api
          Properties:
            RestApiId: !Ref VisionAnalyzerApi
            Path: /config
            Method: post
        SessionLifecycleApi:
          Type: Api
          Properties:
            RestApiId: !Ref VisionAnalyzerApi
            Path: /session
            Method: post
        InspectionResultApi:
          Type: Api
          Properties:
            RestApiId: !Ref VisionAnalyzerApi
            Path: /inspection-result
            Method: post

Outputs:
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  VisionAnalyzerApi:
    Value: !Sub "https://${VisionAnalyzerApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/analyze"
  VisionConfigurationApi:
    Value: !Sub "https://${VisionAnalyzerApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/config"
  VisionSessionLifecycleApi:
    Value: !Sub "https://${VisionAnalyzerApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/session"
  VisionInspectionResultApi:
    Value: !Sub "https://${VisionAnalyzerApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/inspection-result"
