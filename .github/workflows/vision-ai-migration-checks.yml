name: Vision-AI migration checks

on:
  push:
    branches:
      - migration/supabase-fastapi-backend
  pull_request:
    branches:
      - migration/supabase-fastapi-backend

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run audit:recognizer
      - run: npm run audit:eight-point
      - run: npm run build
      - name: Smoke test deployed trial frontend
        run: |
          set -euo pipefail
          html="$(curl --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 -fsS https://vision-ai-aws-trial.onrender.com/)"
          printf '%s' "$html" | grep -q 'id="root"'
          printf '%s' "$html" | grep -Eq 'assets/[^"]+\.js'

  backend:
    name: Backend dependency and syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - name: Smoke test deployed FastAPI and auth guard
        run: |
          set -euo pipefail
          health="$(curl --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 -fsS https://vision-ai-aws-api.onrender.com/health)"
          echo "$health"
          python -c "import json,sys; data=json.loads(sys.argv[1]); assert data.get('status') == 'healthy'; assert data.get('database') == 'connected'" "$health"
          auth_status="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' https://vision-ai-aws-api.onrender.com/v1/inspection-history)"
          echo "Unauthenticated history request HTTP $auth_status (expected 401)"
          test "$auth_status" = "401"
          cors_headers="$(curl --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 -sS -D - -o /dev/null -X OPTIONS https://vision-ai-aws-api.onrender.com/v1/events -H 'Origin: https://vision-ai-aws-trial.onrender.com' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type')"
          printf '%s\n' "$cors_headers"
          printf '%s\n' "$cors_headers" | grep -qi '^access-control-allow-origin: https://vision-ai-aws-trial.onrender.com'
